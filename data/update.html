<!DOCTYPE html>

<body>
  <nav>

      <ul>
        <li><a href="./index.html">Home</a></li>
        <li><a href="./settings.html">Settings</a></li>

      </ul>

  <main class="container">
    <h1>Update Firmware</h1>
    <p>Select <strong>OTA-Update</strong> for standalone firmware or <strong>OTA-ESPHome</strong> for ESPHome.</p>
    <p>Factory, complete-install, and filesystem images cannot be installed here.</p>
    <form method="POST" action="/update" enctype="multipart/form-data">
      <input type="file" name="firmware" accept=".bin" required>
      <button type="submit">Install Update</button>
    </form>
  </main>
</body>

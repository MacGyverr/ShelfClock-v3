# Compile-only integration probe, not clock firmware. Do not upload.
esphome:
  name: shelfclock-core-probe
  min_version: 2026.9.0
  compile_process_limit: 4
  includes:
    - ../lib/ShelfClockCore/src/shelfclock
    - ../include/ShelfClockConfig.h

esp32:
  board: esp32dev
  flash_size: 4MB
  cpu_frequency: 240MHz
  partitions: ../4M-default_nvs.csv
  framework:
    type: arduino
    version: 3.3.11

logger:
  baud_rate: 115200

external_components:
  - source:
      type: local
      path: ../components
    components: [shelfclock_probe]

shelfclock_probe:

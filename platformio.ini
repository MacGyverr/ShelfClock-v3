[platformio]
; Both release scripts build the single environment selected here.
; Future hardware flavors can be added as another [env:name] and selected here.
default_envs = espwroom32

[env]
platform = espressif32@6.2.0
platform_packages =
    platformio/tool-mklittlefs@~1.203.0
framework = arduino
upload_protocol = esptool
monitor_speed = 115200
lib_ignore =
    ESP32 BLE Arduino
lib_deps =
    bblanchon/ArduinoJson@6.21.6
    hieromon/AutoConnect@1.4.2
    end2endzone/NonBlockingRTTTL@1.4.0
    adafruit/Adafruit Unified Sensor@1.1.15
    fastled/FastLED@3.10.3
    adafruit/DHT sensor library@1.4.7
    adafruit/RTClib@2.1.4
    https://github.com/RobTillaart/MultiMap/archive/refs/tags/0.1.7.zip
    kosme/arduinoFFT@1.6.2

; These flags select the ShelfClock geometry, networking, and installed hardware.
; Both Build-ShelfClock scripts read these same effective values.
build_flags =
    ; Optimize the application for flash size.
    -Os
    ; Leave FastLED's optional ESP32 flash-operation lock disabled.
    -D FASTLED_ESP32_FLASH_LOCK=0
    ; false = full-clock wiring map; true = development/test-clock wiring map.
    -D TEST_CLOCK=false
    ; true = permanent ShelfClock access point; Standalone firmware only.
    -D SHELFCLOCK_ISOLATION=false
    ; Enable OpenWeatherMap support and its settings.
    -D HAS_ONLINEWEATHER=true
    ; Enable US weather, rain forecast, and tide support.
    -D HAS_USWEATHER=true
    ; Enable the clock's RTC-dependent runtime behavior.
    -D HAS_RTC=true
    ; Enable the DHT temperature and humidity sensor.
    -D HAS_DHT=true
    ; Enable the I2S microphone and spectrum analyzer.
    -D HAS_SOUNDDETECTOR=true
    ; Enable the buzzer, RTTTL songs, and audible alarms.
    -D HAS_BUZZER=true
    ; Enable the ambient-light sensor and automatic brightness.
    -D HAS_PHOTOSENSOR=true
    ; Optional: override the automatic 4 LEDs for Test or 7 LEDs for Full.
    ; Valid values are 1 through 10.
    ; -D LEDS_PER_SEGMENT=7

[env:espwroom32]
; Tested ESP-WROOM-32 hardware flavor with 4 MB flash.
board = esp32dev
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.filesystem = littlefs
board_build.partitions = 4M-default_nvs.csv

; Release packager metadata. A future flash-size flavor must provide all eight.
custom_flash_size = 4MB
custom_flash_bytes = 0x400000
custom_bootloader_offset = 0x1000
custom_partitions_offset = 0x8000
custom_boot_app_offset = 0xE000
custom_application_offset = 0x10000
custom_filesystem_offset = 0x330000
custom_filesystem_size = 0xD0000
